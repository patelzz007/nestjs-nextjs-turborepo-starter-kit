# Writes the throwaway apps/api/.env every database-backed CI job uses (the API
# e2e job, the single-tenant job and the browser e2e job), so they boot the API
# with the SAME config. The settings live in ONE place,
# packages/tooling/src/api-ci-env/api-ci-env.ts, which `pnpm ci:local` also uses
# for its throwaway databases, so a local run sees exactly what CI sees.
# Signing secrets and encryption keys are random per run and masked in logs.
# apps/api/src/config/__tests__/ci-workflow-env.spec.ts runs the output
# through the API's config schema, so it cannot drift.
name: Write the CI API env
description: Write a throwaway apps/api/.env (random secrets, masked) pointing at the job's database.

inputs:
  database-url:
    description: Connection string of the job's throwaway Postgres database.
    required: true
  tenancy-mode:
    description: >-
      "multi" (TENANCY_ENABLED=true, no default tenant — RewardHub's mode) or "single"
      (TENANCY_ENABLED=false, DEFAULT_TENANT_ID = default-tenant-id). Multi-tenancy plan MT-70.
    required: true
  default-tenant-id:
    description: The tenant a single-tenant job serves (must exist when the API boots). Ignored in multi mode.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write throwaway apps/api/.env
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        TENANCY_MODE: ${{ inputs.tenancy-mode }}
        DEFAULT_TENANT_ID_INPUT: ${{ inputs.default-tenant-id }}
      run: >-
        node packages/tooling/src/api-ci-env/cli.ts
        --out apps/api/.env
        --database-url "$DATABASE_URL"
        --tenancy-mode "$TENANCY_MODE"
        --default-tenant-id "$DEFAULT_TENANT_ID_INPUT"
        --mask-secrets
