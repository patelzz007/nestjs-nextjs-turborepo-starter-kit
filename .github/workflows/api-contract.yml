# API breaking-change check (enhancement 3.5). Phones in the field keep calling the API version they were
# built against, so a removed endpoint, a removed response field or a new required request field must be
# a decision, not an accident.
#
# On every pull request that changes the committed OpenAPI document (docs/generated/openapi.json,
# regenerated by `pnpm tools openapi:export`), oasdiff compares it with the target branch's and fails on
# breaking changes. A reviewed break is waived by adding the label `api-breaking-approved` to the pull
# request (and bumping the API version or documenting the migration in the changelog's upgrade notes).
#
# Locally: docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff breaking <base.json> docs/generated/openapi.json
name: API contract

on:
  pull_request:
    paths:
      - docs/generated/openapi.json
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breaking-changes:
    name: API breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Take the target branch's document
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git show "origin/${BASE_REF}:docs/generated/openapi.json" > "${RUNNER_TEMP}/openapi-base.json"

      - name: Compare (fails on breaking changes unless waived)
        uses: oasdiff/oasdiff-action/breaking@9ce3a29eb0e6478dd0140932a678c7fb59d08f22 # v0.1.20
        with:
          base: ${{ runner.temp }}/openapi-base.json
          revision: docs/generated/openapi.json
          # `''` (no failure) only with the waiver label; written this way round because '' is falsy in expressions.
          fail-on: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') && 'ERR' || '' }}
