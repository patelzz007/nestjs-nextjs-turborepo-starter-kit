# Continuous integration — the merge gate described in rules/13-ci-cd-and-quality-gates.md.
# Job-by-job reference, local equivalents, and planned stages: docs/operations/ci.md
#
# Independent jobs run in parallel. Turborepo task outputs are cached per job in
# the GitHub Actions cache, so unchanged packages replay from cache.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# One run per PR (a new push cancels the stale run); pushes to main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Node.js LTS line used by CI. engines.node (>=20.19) is the floor; CI pins the
  # line it is verified on. Bump deliberately, together with docs/getting-started.md.
  NODE_VERSION: "24"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_UI: "false"
  # Bound the restored local Turborepo cache so it cannot grow run over run.
  TURBO_CACHE_MAX_AGE: 7d
  DO_NOT_TRACK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Lint (zero errors, zero warnings)
        run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Typecheck
        run: pnpm turbo run typecheck

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Unit tests
        run: pnpm turbo run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Next.js apps validate their public config (zod) at build/prerender
      # time. These are NON-secret, browser-visible values; CI only proves the
      # apps build, so the local-dev origins from the apps' .env.example files
      # are used. Turborepo's Next.js framework inference hashes NEXT_PUBLIC_*.
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      NEXT_PUBLIC_MERCHANT_URL: http://localhost:3003
      NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Build every workspace
        run: pnpm turbo run build

  rls-manifest:
    name: RLS manifest drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          generate-prisma-client: "false"
      - name: Check Prisma models ↔ RLS manifest ↔ RLS SQL
        run: pnpm --filter @workspace/api db:check-rls-manifest

  dependency-consistency:
    name: Dependency consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          generate-prisma-client: "false"
      - name: Shared dependency versions are aligned (syncpack)
        run: pnpm turbo run deps:check

  # The two checks below are dependency-free Node scripts: no install needed.
  secret-scan:
    name: Secret scan (.env.example)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Reject real secrets in tracked .env.example files
        run: node packages/tooling/scripts/check-env-example-secrets.mjs

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Validate internal links in docs/
        run: node apps/docs/scripts/check-links.mjs

  e2e:
    name: Database + API e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # Keep in step with compose.yml (local dev) — same major, same patch.
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway service-container database; nothing here is a real credential.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Write throwaway apps/api/.env
        # Signing secrets are random per run and masked in logs. Redis, Kafka and
        # RabbitMQ are left unset: the API falls back to in-memory caches and
        # skips the broker/queue integrations, which the e2e suite does not cover.
        run: |
          random_secret() { openssl rand -hex 32; }
          jwt_access="$(random_secret)"; jwt_refresh="$(random_secret)"
          email_verification="$(random_secret)"; two_factor="$(random_secret)"; mfa_key="$(openssl rand -base64 32)"
          tenant_master_key="$(openssl rand -base64 32)"  # exactly 32 bytes, base64 (validated at boot)
          for value in "$jwt_access" "$jwt_refresh" "$email_verification" "$two_factor" "$mfa_key" "$tenant_master_key"; do echo "::add-mask::${value}"; done
          cat > apps/api/.env <<EOF
          NODE_ENV=test
          DATABASE_URL=${DATABASE_URL}
          JWT_ACCESS_SECRET=${jwt_access}
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_SECRET=${jwt_refresh}
          JWT_REFRESH_EXPIRY=7d
          EMAIL_VERIFICATION_SECRET=${email_verification}
          TWO_FACTOR_PENDING_SECRET=${two_factor}
          MFA_ENCRYPTION_KEYS={"1":"${mfa_key}"}
          TENANT_ENCRYPTION_MASTER_KEY=${tenant_master_key}
          BCRYPT_SALT_ROUNDS=10
          FORCE_LOGIN_VERIFICATION=false
          EMAIL_MODE=noop
          EMAIL_FROM_ADDRESS=noreply@example.com
          STORAGE_PROVIDER=local
          APP_NAME=Starter Kit CI
          APP_URL=http://localhost:3000
          ADMIN_APP_URL=http://localhost:3001
          MERCHANT_APP_URL=http://localhost:3003
          CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3003
          COOKIE_DOMAIN=localhost
          EOF

      - name: Build workspace dependencies of the API
        run: pnpm turbo run build --filter=@workspace/api^...

      - name: Apply migrations + RLS (prisma migrate deploy → db:apply-security)
        run: pnpm db:deploy

      - name: Seed the development scenario (proves seed.ts matches the schema)
        run: pnpm db:seed -- --scenario development

      - name: API e2e tests
        run: pnpm --filter @workspace/api test:e2e

      - name: Seed the enterprise scenario (additive; proves the scenario still runs)
        run: pnpm db:seed -- --scenario enterprise --seed 1
