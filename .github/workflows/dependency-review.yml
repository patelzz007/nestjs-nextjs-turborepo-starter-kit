# Weekly dependency review — the date-based checks that must NOT run on every push.
#
# pnpm-workspace.yaml records time-boxed decisions: accepted advisories
# (auditConfig.ignoreGhsas, each with `# review-by:`) and supply-chain cooldown
# exceptions (minimumReleaseAgeExclude, each with "Delete this entry on or after").
# Push CI (ci.yml) only checks that they are well-formed, so a passing calendar
# day never blocks a push. This workflow reports the ones that are due, and runs
# the advisory audit on a schedule so new advisories surface even in quiet weeks.
# A failed run notifies the repository's watchers; fix it by following the
# printed action, then re-run it (or wait for the next week).
name: Dependency review

on:
  schedule:
    # Mondays 01:00 UTC (09:00 Asia/Kuala_Lumpur).
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"

jobs:
  due-exceptions:
    name: Due dependency exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Report accepted advisories and cooldown exceptions that are due
        # Dependency-free Node script: no install needed.
        run: node packages/tooling/scripts/check-dependency-exceptions.mjs

  audit:
    name: Dependency audit (high + critical advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: pnpm audit (fails on high or critical)
        run: pnpm audit --audit-level=high
