# The docs sync (ADR 084): reads the published documents, writes generated Markdown, and opens one docs pull request.
# Setup: docs/technical/operations/docs-publishing.md
#
# Starts three ways: the API's `workflow_dispatch` when Notion reports a change (or an operator presses Sync now), the
# 15-minute schedule that catches anything missed, and the nightly full rebuild that repairs drift.
#
# Off until you switch it on: set the repository variable DOCS_SYNC_ENABLED=true, the secrets below, and the GitHub
# App. A fork without them skips this workflow instead of failing.
name: Docs sync

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "What started this run"
        type: choice
        options: [MANUAL, WEBHOOK]
        default: MANUAL
      full:
        description: "Rebuild every page"
        type: choice
        options: ["false", "true"]
        default: "false"
  schedule:
    - cron: "*/15 * * * *"
    # 19:00 UTC: 03:00 in Malaysia.
    - cron: "0 19 * * *"

# The App's token does the writing; the job's own token only reads.
permissions:
  contents: read

# One run at a time. A run waiting behind this one is replaced by a newer request, so rapid edits collapse into
# one sync, and a running sync is never cancelled halfway.
concurrency:
  group: docs-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "26.13.1"
  SYNC_BRANCH: docs-sync/main
  # How long a webhook run waits, so edits made together join it.
  COLLAPSE_WINDOW_SECONDS: "30"

jobs:
  sync:
    name: Sync
    if: vars.DOCS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create the docs bot's token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          generate-prisma-client: "false"

      - name: Build shared
        run: pnpm --filter @workspace/shared build

      - name: Work out what started this run
        id: run
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TRIGGER: ${{ inputs.trigger }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          trigger="$INPUT_TRIGGER"
          if [[ "$EVENT" == "schedule" ]]; then
            if [[ "$SCHEDULE" == "0 19 * * *" ]]; then trigger=NIGHTLY; else trigger=SCHEDULE; fi
          fi
          args=(--trigger "$trigger")
          if [[ "$INPUT_FULL" == "true" ]]; then args+=(--full); fi
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Wait for edits made together
        if: steps.run.outputs.trigger == 'WEBHOOK'
        run: sleep "$COLLAPSE_WINDOW_SECONDS"

      - name: Sync
        env:
          ARGS: ${{ steps.run.outputs.args }}
          DOCS_SOURCE: ${{ vars.DOCS_SOURCE || 'NOTION' }}
          NOTION_READ_TOKEN: ${{ secrets.NOTION_READ_TOKEN }}
          NOTION_DOCS_DATA_SOURCE_ID: ${{ vars.NOTION_DOCS_DATA_SOURCE_ID }}
          NOTION_BLOG_DATA_SOURCE_ID: ${{ vars.NOTION_BLOG_DATA_SOURCE_ID }}
        run: |
          read -ra args <<< "$ARGS"
          node packages/docs-sync/src/cli.ts run "${args[@]}"

      - name: Open or update the pull request
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard docs)" ]]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "docs-sync[bot]"
          git config user.email "docs-sync[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add docs
          git commit -m "docs: sync published pages"
          git push --force origin "$SYNC_BRANCH"
          url="$(gh pr list --head "$SYNC_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$url" ]]; then
            url="$(gh pr create --head "$SYNC_BRANCH" --base main --title "docs: sync published pages" --body "Generated by the docs sync. Docs: not needed, this is the docs.")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether it may merge by itself
        id: classify
        if: steps.publish.outputs.url != ''
        run: node packages/tooling/src/docs-guard/cli.ts classify --base origin/main --output "$GITHUB_OUTPUT"

      - name: Merge a routine edit once its checks pass
        if: steps.classify.outputs.routine == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          URL: ${{ steps.publish.outputs.url }}
        run: gh pr merge "$URL" --auto --squash

      - name: Report to the Operations console
        if: always()
        env:
          DOCS_SYNC_API_URL: ${{ vars.DOCS_SYNC_API_URL }}
          DOCS_SYNC_REPORT_TOKEN: ${{ secrets.DOCS_SYNC_REPORT_TOKEN }}
          URL: ${{ steps.publish.outputs.url }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          if [[ ! -f .artifacts/docs-sync/report.json ]]; then
            echo "The sync wrote no report."
            exit 0
          fi
          args=()
          if [[ -n "$URL" ]]; then args+=(--pull-request-url "$URL"); fi
          if [[ -n "$COMMIT" ]]; then args+=(--commit "$COMMIT"); fi
          node packages/docs-sync/src/cli.ts report "${args[@]}"
