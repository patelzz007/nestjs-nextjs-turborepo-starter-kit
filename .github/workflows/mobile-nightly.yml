name: Mobile nightly

# Enhancements 3.7 and 6.6: every night (and on demand), a release build of the mobile app on an Android
# emulator, against a freshly seeded API on the runner: the Maestro flows (apps/mobile/.maestro) drive it the
# way a person would, and its cold start is measured (packages/tooling/scripts/mobile-cold-start.mjs).
# The emulator reaches the runner's API at 10.0.2.2 (Android's address for its host), over plain http on that
# private address only (EXPO_PUBLIC_ALLOW_LAN_HTTP_API, apps/mobile/src/lib/env.ts).

on:
  schedule:
    # 19:00 UTC: 03:00 in Malaysia, when no one is merging.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-nightly
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"
  # Throwaway service-container database; nothing here is a real credential.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_ci?schema=public
  REDIS_URL: redis://localhost:6379
  # The release build calls the runner's API from the emulator.
  EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
  EXPO_PUBLIC_ALLOW_LAN_HTTP_API: "true"
  # A seeded, email-verified account the flows sign in with (apps/api/prisma/seed/users.ts).
  MAESTRO_EMAIL: developer@example.com
  MAESTRO_PASSWORD: Developer@123
  MAESTRO_VERSION: "2.12.1"

jobs:
  android:
    name: Android emulator (Maestro flows, cold start)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # Keep in step with compose.yml (local dev) and ci.yml.
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Write throwaway apps/api/.env
        uses: ./.github/actions/write-api-ci-env
        with:
          database-url: ${{ env.DATABASE_URL }}
          tenancy-mode: multi

      - name: Build the API
        run: pnpm turbo run build --filter=@workspace/api

      - name: Restore the pinned geo dataset (the seed downloads and verifies it on a miss)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/.cache/geo-dataset
          key: geo-dataset-${{ hashFiles('apps/api/prisma/seed/geo-dataset.ts') }}

      - name: Apply migrations + RLS, seed the development scenario
        run: |
          pnpm tools db:deploy
          pnpm db:seed -- --scenario development

      - name: Start the API (background, log kept)
        run: |
          mkdir -p .ci-logs
          nohup pnpm --filter @workspace/api start > .ci-logs/api.log 2>&1 &
          node packages/tooling/scripts/wait-for-http.mjs --timeout-ms 120000 http://localhost:8080/health/ready

      - name: Set up Java (the Android build)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the release APK (pointed at the runner's API)
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL --retry 3 "https://get.maestro.mobile.dev" -o "$RUNNER_TEMP/install-maestro.sh"
          MAESTRO_VERSION="$MAESTRO_VERSION" bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Allow the emulator hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows and measure the cold start on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            pnpm e2e:device --format junit --output ../../.ci-logs/maestro-report.xml
            pnpm cold-start | tee ../../.ci-logs/cold-start.txt

      - name: Upload the Maestro report, cold start and API log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-logs/
            ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 14
