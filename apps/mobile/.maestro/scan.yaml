# The till (scan and redeem reward codes) opens from Settings: pairing first, or the paired till.
appId: ${APP_ID}
name: Till scan
tags: [smoke]
---
- runFlow: subflows/signed-in.yaml
# Tabs by their ids, never by label: a label can also be the system's (see sign-in.yaml).
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element: "Till"
- tapOn: "Till"
- assertVisible: "Pair this phone as a till|This till"
- back
