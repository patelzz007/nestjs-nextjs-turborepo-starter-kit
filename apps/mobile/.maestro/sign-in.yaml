# Signed in, the app opens on Home with the person's name.
appId: ${APP_ID}
name: Sign in
tags: [smoke]
---
- runFlow: subflows/signed-in.yaml
# The tab by its id, never by "Home": Android's own navigation bar has a Home button with that label, and
# pressing it sends the app to the background (the 2026-11-21 nightly).
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "home-highlights"
