// The app's own picture notification (apps/mobile/modules/picture-notification, ADR 070):
// NotificationCompat.BigPictureStyle, which Android ships — no third-party library.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.picturenotification'
version = '1.0.0'

android {
  namespace "expo.modules.picturenotification"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core:1.13.1'
}
