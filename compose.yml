# Local infrastructure for development. DEV ONLY — never deploy this file.
#
# Usage:
#   docker compose up -d            (or: pnpm docker:up)
#   docker compose ps
#   docker compose down             (keeps data volumes; add -v to wipe them)
#
# BullMQ is a Node.js library — it has no standalone container. It stores jobs in Redis.
# The bull-board service below is an optional dashboard for monitoring BullMQ queues.
#
# Service URLs (from the host machine):
#   Redis       → localhost:6379
#   Kafka       → 127.0.0.1:9092  (IPv4 literal on purpose — see the kafka service)
#   RabbitMQ    → localhost:5672  (AMQP)  |  http://localhost:15672  (management UI, rabbit / rabbit)
#   Bull Board  → http://localhost:3030  (BullMQ queue dashboard)
#   Mailpit     → localhost:1025  (SMTP)  |  http://localhost:8025  (web inbox)
#
# Not started by this file:
#   PostgreSQL  — the `postgres` service below is commented out. Use a native
#                 PostgreSQL 18 (Homebrew, apt, Postgres.app), or uncomment it
#                 (postgres / postgres, database nestjs-nextjs-turborepo-starter-kit,
#                 port POSTGRES_PORT, default 5432 — e.g. POSTGRES_PORT=5433 when a
#                 native PostgreSQL already owns 5432, then use :5433 in
#                 apps/api/.env DATABASE_URL).
#   Object storage — there is no MinIO service. Use STORAGE_PROVIDER=local for
#                 zero-setup storage, or a real S3 bucket (apps/api/.env.example).
#
# Mailpit's host ports are env-interpolated with the dev defaults shown above
# (MAILPIT_SMTP_PORT / MAILPIT_UI_PORT) — override them in your shell or a
# git-ignored `.env` file next to this compose file.
#
# Full reference: docs/technical/operations/local-infrastructure.md
#
# EVERY service binds to 127.0.0.1 only, so the default dev passwords are never
# reachable from other machines on your network. Host ports and the RabbitMQ
# credentials can be overridden (RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS,
# REDIS_PORT, KAFKA_PORT, RABBITMQ_AMQP_PORT, RABBITMQ_UI_PORT, BULL_BOARD_PORT).

name: hello-world

services:
  # Not started by default — see the header. Uncomment to run PostgreSQL in Docker.
  # postgres:
  #   # Same major as the documented local install (PostgreSQL 18) and the CI service container.
  #   image: postgres:18.6
  #   container_name: hello-world-postgres
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  #   environment:
  #     # POSTGRES_DB is created on first start. `pnpm db:deploy` then applies the
  #     # migrations and prisma/rls*.sql, which create the `app_runtime` RLS role.
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     POSTGRES_DB: ${POSTGRES_DB:-nestjs-nextjs-turborepo-starter-kit}
  #   volumes:
  #     # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker.
  #     # The volume name carries the major version: a major upgrade needs a
  #     # dump/restore, and a fresh volume can never be mixed with older data files.
  #     - postgres_18_data:/var/lib/postgresql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #     start_period: 10s
  #   networks:
  #     - infra

  redis:
    image: redis:8.10.1
    container_name: hello-world-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - infra

  kafka:
    image: apache/kafka:4.3.1
    container_name: hello-world-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Host clients connect to the address the broker ADVERTISES (metadata), not
      # only to their bootstrap address. Advertise the exact address the port is
      # published on (127.0.0.1 — IPv4 only, like every port in this file) and
      # follow KAFKA_PORT: `localhost` resolves to ::1 first on macOS and many
      # Linux hosts, and librdkafka then logs a refused IPv6 connection (and
      # "all broker connections are down") on every (re)connect.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Same as CI: clients never auto-create topics, and neither does the broker.
      # Topics come from `pnpm --filter @workspace/analytics-consumer kafka:provision-topics`.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # The in-network listener: its advertised address (kafka:29092) resolves
          # inside the container whatever host port KAFKA_PORT publishes.
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - infra

  rabbitmq:
    image: rabbitmq:4.3.5
    container_name: hello-world-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - infra

  bull-board:
    image: venatum/bull-board:3.4.14
    container_name: hello-world-bull-board
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BULL_BOARD_PORT:-3030}:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_USE_TLS: "false"
      BULL_PREFIX: bull
      QUEUE_NAMES: email.send,rewards.auto-publish,claims.expire-pending,claims.expire-referrer,outbox.publish,storage.cleanup,storage.delete,idempotency.retention,storage.scan,outbox.retention,rewards.referral-credit-notify,storage.cdn-invalidate
    networks:
      - infra

  mailpit:
    # Local SMTP sink + web inbox. Nothing sent to it leaves your machine.
    image: axllent/mailpit:v1.31.3
    container_name: hello-world-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      # Accept any SMTP credentials over plain TCP — dev only.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - infra
      
volumes:
  postgres_18_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
  mailpit_data:

networks:
  infra:
    name: hello-world-infra
