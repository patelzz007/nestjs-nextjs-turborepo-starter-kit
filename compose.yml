# Local infrastructure for development. DEV ONLY — never deploy this file.
#
# Usage:
#   docker compose up -d            (or: pnpm docker:up)
#   docker compose ps
#   docker compose down             (keeps data volumes; add -v to wipe them)
#
# BullMQ is a Node.js library — it has no standalone container. It stores jobs in Redis.
# The bull-board service below is an optional dashboard for monitoring BullMQ queues.
#
# Service URLs (from the host machine):
#   PostgreSQL  → localhost:5432  (postgres / postgres, database nestjs-nextjs-turborepo-starter-kit)
#   Redis       → localhost:6379
#   Kafka       → localhost:9092
#   RabbitMQ    → localhost:5672  (AMQP)  |  http://localhost:15672  (management UI, rabbit / rabbit)
#   Bull Board  → http://localhost:3030  (BullMQ queue dashboard)
#   Mailpit     → localhost:1025  (SMTP)  |  http://localhost:8025  (web inbox)
#   MinIO       → http://localhost:9000  (S3 API)  |  http://localhost:9001  (console, minioadmin / minioadmin)
#
# Credentials and host ports of the newer services (postgres, mailpit, minio) are
# env-interpolated with the dev defaults shown above — override them in your shell
# or a git-ignored `.env` file next to this compose file, e.g. when a native
# PostgreSQL already owns port 5432:
#   POSTGRES_PORT=5433 docker compose up -d     (then use :5433 in apps/api/.env DATABASE_URL)
# Full reference: docs/operations/local-infrastructure.md
#
# The new services bind to 127.0.0.1 only, so the default dev passwords are never
# reachable from other machines on your network.

name: hello-world

services:
  # postgres:
  #   # Same major as the documented local install (PostgreSQL 18) and the CI service container.
  #   image: postgres:18.6
