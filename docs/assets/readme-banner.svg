<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="NestJS + Next.js + PostgreSQL starter kit">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0234e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#e0234e" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#336791" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#accent)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200"/>
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360"/>
  </g>

  <!-- Official brand logos (Simple Icons) -->
  <g transform="translate(64 88)" filter="url(#shadow)">
    <rect width="88" height="88" rx="20" fill="#ffffff" fill-opacity="0.08"/>
    <image href="logos/nestjs.svg" x="14" y="14" width="60" height="60"/>
  </g>
  <g transform="translate(168 88)" filter="url(#shadow)">
    <rect width="88" height="88" rx="20" fill="#ffffff" fill-opacity="0.08"/>
    <image href="logos/nextjs.svg" x="14" y="14" width="60" height="60"/>
  </g>
  <g transform="translate(272 88)" filter="url(#shadow)">
    <rect width="88" height="88" rx="20" fill="#ffffff" fill-opacity="0.08"/>
    <image href="logos/postgresql.svg" x="14" y="14" width="60" height="60"/>
  </g>

  <text x="388" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2">NestJS + Next.js + PostgreSQL</text>
  <text x="388" y="158" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="600">Starter Kit</text>
  <text x="388" y="192" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500">Turborepo monorepo | type-safe API | shared Zod contracts | production-ready DX</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(388 218)">
      <rect width="86" height="34" rx="17" fill="#e0234e" fill-opacity="0.18" stroke="#e0234e" stroke-opacity="0.45"/>
      <text x="43" y="22" fill="#fecdd3" text-anchor="middle">NestJS</text>
    </g>
    <g transform="translate(484 218)">
      <rect width="86" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="43" y="22" fill="#f8fafc" text-anchor="middle">Next.js</text>
    </g>
    <g transform="translate(580 218)">
      <rect width="98" height="34" rx="17" fill="#3178c6" fill-opacity="0.18" stroke="#3178c6" stroke-opacity="0.45"/>
      <text x="49" y="22" fill="#dbeafe" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(688 218)">
      <rect width="108" height="34" rx="17" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="54" y="22" fill="#e0f2fe" text-anchor="middle">TailwindCSS</text>
    </g>
    <g transform="translate(806 218)">
      <rect width="58" height="34" rx="17" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="29" y="22" fill="#fef3c7" text-anchor="middle">Zod</text>
    </g>
    <g transform="translate(874 218)">
      <rect width="108" height="34" rx="17" fill="#336791" fill-opacity="0.22" stroke="#336791" stroke-opacity="0.5"/>
      <text x="54" y="22" fill="#dbeafe" text-anchor="middle">PostgreSQL</text>
    </g>
    <g transform="translate(388 264)">
      <rect width="78" height="34" rx="17" fill="#111827" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="39" y="22" fill="#e2e8f0" text-anchor="middle">Fastify</text>
    </g>
    <g transform="translate(476 264)">
      <rect width="98" height="34" rx="17" fill="#2d3748" fill-opacity="0.55" stroke="#94a3b8" stroke-opacity="0.35"/>
      <text x="49" y="22" fill="#e2e8f0" text-anchor="middle">Prisma ORM</text>
    </g>
  </g>

  <text x="388" y="330" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Database -&gt; Prisma -&gt; Zod -&gt; NestJS (Fastify) -&gt; Next.js -&gt; UI</text>
</svg>
