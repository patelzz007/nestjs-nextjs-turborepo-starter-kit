# @darraghor/eslint-plugin-nestjs-typed does `import ts from "typescript"`
# directly (undisclosed in its manifest), so Node resolves the hoisted TS 7
# (which has no compiler API) and its rules crash. Inject the TS 6 API shim
# as an explicit dep of the plugin so its require resolves locally.
packageExtensions:
  "@darraghor/eslint-plugin-nestjs-typed":
    dependencies:
      typescript: "6.0.2"

# ── Dependency overrides ──────────────────────────────────────────────────
# Force ONE version of @types/pg for the whole tree. @prisma/adapter-pg ships
# its own `@types/pg` (a runtime dep of the adapter) and apps/api declares it as
# a devDependency; when the two resolve to different minors, `Pool` from `pg`
# is two structurally different types and `new PrismaPg(pool)` fails TS2345
# (e.g. the `connect` event overload added in 8.20.4 vs 8.20.3).
overrides:
  "@types/pg": "8.20.4"
  typescript: "6.0.2"
  fastify: "5.12.3"
  # ── Security advisories (pnpm audit), scoped to the parents that pin old versions.
  # prisma@7.10 (newest stable) pins these exact versions in its CLI/config
  # packages. Remove each override once a Prisma release ships the patched dep.
  "@prisma/config>deepmerge-ts": "8.0.2" # GHSA: deepmerge-ts <8.0.0
  "prisma>mysql2": "3.24.5" # GHSA: mysql2 <3.23.1 (MySQL driver, unused with Postgres)
  # @google-cloud/storage and google-gax (via firebase-admin) still depend on uuid ^9; their
  # callers only use `require("uuid").v4()`, which uuid 11 (CJS + ESM) keeps.
  "teeny-request>uuid": "11.1.1" # GHSA: uuid <11.1.1
  "gaxios>uuid": "11.1.1"
  "google-gax>uuid": "11.1.1"

# typescript-eslint@8.x does not support TypeScript 7.0 (no compiler API).
# Keep the whole workspace on TS 6.0.2 until TS 7.1 + typescript-eslint support
# land. See https://github.com/typescript-eslint/typescript-eslint/issues/10940

# nestjs-zod@5.5.0 (latest) has not yet widened its peer ranges to Nest 12.
# It is exercised end to end by the API unit + e2e suites on Nest 12; remove
# these once nestjs-zod publishes Nest 12 peer support.
peerDependencyRules:
  allowedVersions:
    "nestjs-zod>@nestjs/common": "12"
    "nestjs-zod>@nestjs/swagger": "12"

# kafkajs@2.2.4 is the final release (the project is unmaintained). Its
# RequestQueue.scheduleCheckPendingRequests passes `throttledUntil - Date.now()`
# to setTimeout while throttledUntil is still -1, i.e. a large negative delay:
# Node clamps it to 1ms but prints a TimeoutNegativeWarning on every connect.
# The patch clamps the delay to 0 itself — identical timing, no warning.
# Drop it when kafkajs is replaced (or fixed upstream).
patchedDependencies:
  kafkajs@2.2.4: patches/kafkajs@2.2.4.patch
