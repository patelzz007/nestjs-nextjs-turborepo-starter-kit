packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Kafka client (librdkafka binding): its install script fetches the prebuilt
  # librdkafka binary for this platform (falls back to a node-gyp build).
  '@confluentinc/kafka-javascript': true
  '@firebase/util': true
  "@nestjs/swagger": true
  "@prisma/engines": true
  "@scarf/scarf": true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  # Jest's file watcher (via jest-expo 58 → Jest 30's jest-haste-map). It ships prebuilt binaries as
  # optional per-platform packages; its install script only compiles from source when
  # `npm_config_build_from_source=true`, so it never needs to run here.
  "@parcel/watcher": false
  msgpackr-extract: true
  msw: false
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# ── Supply-chain cooldown ─────────────────────────────────────────────────
# A dependency version must have been public for a day before it can be
# installed (pnpm's built-in default, stated explicitly so it is STRICT: a
# too-young version stops the install instead of being silently appended to
# an exclusion list). To take a fresh release early (e.g. a security fix),
# add `name@version` under `minimumReleaseAgeExclude` WITH a comment giving the
# reason and the date after which the entry can be deleted. Push CI only checks
# the entry is well-formed; the weekly `dependency-review` workflow reports it
# once that date arrives (it never blocks a push).
minimumReleaseAge: 1440

# @darraghor/eslint-plugin-nestjs-typed (an oxlint JS plugin, see
# packages/oxlint-config) does `import ts from "typescript"` directly
# (undisclosed in its manifest) and runs on @typescript-eslint/utils, which peers
# `typescript <6.1.0`. Both need the TypeScript JS API, which TypeScript 7 no
# longer ships, so Node would resolve the workspace's TS 7 and the rules would
# crash. Give the plugin TS 6 as an explicit dependency so it, and the
# @typescript-eslint packages whose peer it satisfies, resolve TS 6 locally.
# Remove once the plugin and typescript-eslint support TypeScript 7.
packageExtensions:
  "@darraghor/eslint-plugin-nestjs-typed":
    dependencies:
      typescript: "6.0.3"

# ── Dependency overrides ──────────────────────────────────────────────────
# Force ONE version of @types/pg for the whole tree. @prisma/adapter-pg ships
# its own `@types/pg` (a runtime dep of the adapter) and apps/api declares it as
# a devDependency; when the two resolve to different minors, `Pool` from `pg`
# is two structurally different types and `new PrismaPg(pool)` fails TS2345
# (e.g. the `connect` event overload added in 8.20.4 vs 8.20.3).
overrides:
  "@types/pg": "8.23.1"
  # One fastify for the app and @nestjs/platform-fastify (the adapter's request/
  # reply types must be the same declarations the app imports). 5.12.5 is the
  # first release with the GHSA-4mh8-r7rc-xpvc fix (HTTP/2 trailer DoS).
  fastify: "5.12.7"
  # ── Security advisories (pnpm audit), scoped to the parents that pin old versions.
  # prisma@7.10 (newest stable) pins these exact versions in its CLI/config
  # packages. Remove each override once a Prisma release ships the patched dep.
  "@prisma/config>deepmerge-ts": "8.0.2" # GHSA: deepmerge-ts <8.0.0
  "prisma>mysql2": "3.24.5" # GHSA: mysql2 <3.23.1 (MySQL driver, unused with Postgres)
  # gaxios@6 (via firebase-admin@14 → @google-cloud/storage@8 → google-auth-library@9) still
  # depends on uuid ^9; it only uses `require("uuid").v4()`, which uuid 11 (CJS + ESM) keeps.
  # packages/tooling/__tests__/dependency-overrides.test.mjs loads uuid from the parent's
  # install and calls v4() the way it does, so a breaking override fails the tests.
  # (google-gax and teeny-request dropped uuid in the versions firebase-admin@14 pulls.)
  "gaxios>uuid": "11.1.1" # GHSA: uuid <11.1.1
  # concurrently@10.0.5 (latest, root dev tooling) pins shell-quote 1.9.0 exactly and only calls
  # `quote()`; 1.12.0 is semver-compatible. dependency-overrides.test.mjs calls quote() through
  # concurrently's install. Remove once a concurrently release depends on shell-quote >=1.11.0.
  "concurrently>shell-quote": "1.12.0" # GHSA-pqg4-j6r4-53mv: shell-quote >=1.8.4 <1.11.0
  # @expo/cli@58 (apps/mobile dev CLI) depends on zod ^3.25.76; GHSA-mrhx-c7xc-m3w5 (memory exhaustion on
  # oversized arrays) affects every zod <4.6.6 and the 3.x line has no fix. @expo/cli uses zod in two
  # schema modules (DevTools plugin manifests and their output) with builders and `safeParse` /
  # `error.issues` that zod 4 keeps as they were; dependency-overrides.test.mjs runs those schemas
  # through the overridden copy. Remove once an @expo/cli release depends on zod >=4.6.6.
  "@expo/cli>zod": "4.6.7" # GHSA-mrhx-c7xc-m3w5: zod <4.6.6

# ── Majors held back (re-checked 2026-10-06; re-check on every dependency sweep) ──
# typescript (apps/docs only) 7: `astro check` runs on Volar, which needs the
# TypeScript JS API that TypeScript 7 removed; @astrojs/check 0.9.12 (latest) peers
# `^5 || ^6`. apps/docs stays on 6.0.3 (pinned in .syncpackrc.json) until it supports 7.
# Every other workspace is on TypeScript 7 and type-checks with tsrs.
# prisma 8: npm's `latest` tag points at a release candidate (8.0.0-rc.x) while
# @prisma/client latest is 7.10.0. Stay on 7.10.x until 8.0.0 ships as a stable release.

# nestjs-zod@5.5.0 (latest) has not yet widened its peer ranges to Nest 12.
# It is exercised end to end by the API unit + e2e suites on Nest 12; remove
# these once nestjs-zod publishes Nest 12 peer support.
peerDependencyRules:
  allowedVersions:
    "nestjs-zod>@nestjs/common": "12"
    "nestjs-zod>@nestjs/swagger": "12"
    # @nestjs/swagger's optional `typescript` peer (^5.5 || ^6) is for its CLI
    # compiler plugin only (`@nestjs/swagger/plugin`), which this repo does not use:
    # the API builds with rspack + SWC and documents routes with nestjs-zod. Its
    # runtime never loads TypeScript (checked: importing it leaves `typescript`
    # out of the module cache). Remove once @nestjs/swagger peers TypeScript 7.
    "@nestjs/swagger>typescript": "7"

# ── Accepted audit advisories ─────────────────────────────────────────────
# ONLY for an advisory with NO patched version, after checking it cannot be
# reached with untrusted input. Every entry needs a reason and a review date
# (push CI checks both exist: packages/tooling/__tests__/dependency-exceptions.test.mjs).
# The weekly `dependency-review` workflow reports entries past their review date,
# forcing a re-check (is a fix out? upgrade and remove the entry) without ever
# blocking a push.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS on deeply nested brace patterns; no patched
    # release exists (3.0.3 is the latest). Reached only through build/lint tooling —
    # @next/eslint-plugin-next and the shadcn CLI (ts-morph) via fast-glob → micromatch —
    # which expand glob patterns written in this repository, never request input.
    # review-by: 2026-11-04
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <=1.4.0 RSA PKCS#1 v1.5 signature verification accepts extra nested DigestAlgorithm
    # elements; no patched release exists (1.4.0 is the latest). Reached only through the Expo CLI
    # (@expo/cli and @expo/code-signing-certificates, apps/mobile dev tooling), which signs and checks
    # expo-updates manifests and reads iOS signing certificates with the developer's OWN keys on the
    # developer's machine — never untrusted input, and node-forge is not part of the app bundle.
    # review-by: 2026-11-09
    - GHSA-86w9-cpqp-85rv

