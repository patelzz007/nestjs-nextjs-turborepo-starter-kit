  - '@rspack/binding-win32-ia32-msvc@2.2.2'
  - '@rspack/binding-win32-x64-msvc@2.2.2'
  - '@rspack/binding@2.2.2'
  - '@rspack/cli@2.2.2'
  - '@rspack/core@2.2.2'
  - '@typescript-eslint/eslint-plugin@8.69.0'
  - '@typescript-eslint/parser@8.69.0'
  - '@typescript-eslint/scope-manager@8.69.0'
